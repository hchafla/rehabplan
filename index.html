<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RehabPlan</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


<h1>RehabPlan</h1>



<h2>Datos del paciente</h2>


<div class="datos-paciente">


    <label>
        Nombre:

        <input 
            type="text"
            id="nombrePaciente"
            placeholder="Nombre del paciente"
        >

    </label>



    <label>
        Fecha:

        <input 
            type="date"
            id="fechaPlan"
        >

    </label>



    <label>
        Observaciones generales:

        <textarea 
            id="observacionesPaciente"
            placeholder="Observaciones del plan..."
        ></textarea>

    </label>


</div>





<h2>Biblioteca de ejercicios</h2>


<div class="filtros">


    <input 
        type="text"
        id="buscador"
        placeholder="Buscar ejercicio..."
    >



    <select id="filtroRegion">

        <option value="">
            Todas las regiones
        </option>

    </select>



    <select id="filtroMaterial">

        <option value="">
            Todos los materiales
        </option>

    </select>


</div>




<div id="biblioteca"></div>







<h2>Plan del paciente</h2>


<button onclick="nuevoPlan()">
    Nuevo plan
</button>


<button onclick="generarPDF()">
    Generar PDF
</button>



<div id="planPaciente"></div>





<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script src="script.js"></script>


</body>

</html>
